[project]
name = "essence"
version = "0.1.0"
description = "Interactive gas price map for Quebec — deployed to GitHub Pages via GitHub Actions."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "branca>=0.8.1",
    "fiona>=1.10.1",
    "folium>0.14",
    "geopandas>=1.1.3",
    "mapclassify>=2.10.0",
    "matplotlib>=3.11.0",
    "pandas>=3.0.2",
    "pathlib>=1.0.1",
    "pyarrow>=20.0.0",
    "requests>=2.33.1",
    "tzdata",
]

[[tool.uv.index]]
name = "piwheels"
url = "https://www.piwheels.org/simple"
