<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Québec Gas Price Statistics</title>
<link rel="shortcut icon" href="favicon.png" type="image/png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<!--COLORBAR-->
<style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; font-family: sans-serif; color: #222; background: #f5f5f5; }

    /* Desktop: selector and panel on the left half, minimap on the right half. */
    #app {
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: auto 1fr;
        grid-template-areas: "selector map" "panel map";
        height: 100%;
    }
    .selector { grid-area: selector; display: flex; gap: 10px; padding: 16px 20px 8px; align-items: center; }
    .selector select {
        flex: 1; min-width: 0; height: 44px; padding: 0 12px; font-size: 16px;
        border: 1px solid #ccc; border-radius: 10px; background: #fff;
    }
    /* The bottom padding lets the content scroll clear of the floating navigation pill. */
    .panel { grid-area: panel; overflow-y: auto; padding: 8px 20px 110px; }
    .handle { display: none; }
    /* isolation keeps the Leaflet controls, attribution and colourbar (z-index 1000) beneath the panel and selector. */
    #map { grid-area: map; height: 100%; min-height: 0; background: #e8e8e8; isolation: isolate; }

    h1 { font-size: 18px; margin: 8px 0 12px; }
    .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px; }
    .tile { background: #fff; border-radius: 10px; padding: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .tile .label { font-size: 12px; color: #666; }
    .tile .value { font-size: 20px; font-weight: 600; margin-top: 2px; }
    .tile .unit { font-size: 12px; font-weight: 400; color: #666; }
    .toggle { display: flex; gap: 6px; margin-bottom: 10px; }
    .toggle button {
        flex: 1; height: 36px; border: 1px solid #ccc; border-radius: 8px; background: #fff; font-size: 14px; cursor: pointer;
    }
    .toggle button.active { background: #007aff; border-color: #007aff; color: #fff; }
    .chart-box { position: relative; height: 260px; background: #fff; border-radius: 10px; padding: 8px; margin-bottom: 14px; }
    .compare { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-bottom: 14px; }
    .compare .value.up { color: #c0392b; }
    .compare .value.down { color: #1e8e3e; }
    .note { font-size: 12px; color: #777; }
    .empty { padding: 24px; text-align: center; color: #666; }

    /* Same tooltip and user marker styles as the main map. */
    .leaflet-tooltip, .leaflet-tooltip *, .foliumtooltip, .foliumtooltip * { font-size: 11px !important; }
    .user-location-marker { background: none !important; border: none !important; }
    .blue-dot {
        width: 14px; height: 14px; background-color: #007aff; border: 2.5px solid #fff; border-radius: 50%;
        box-shadow: 0 0 5px rgba(0, 0, 0, 0.4); position: absolute; top: 50%; left: 50%;
        transform: translate(-50%, -50%); z-index: 1000;
    }
    .blue-dot-pulse {
        width: 32px; height: 32px; background-color: rgba(0, 122, 255, 0.25); border-radius: 50%; position: absolute;
        top: 50%; left: 50%; transform: translate(-50%, -50%); animation: pulse 1.8s infinite ease-out;
        z-index: 999; pointer-events: none;
    }
    @keyframes pulse {
        0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
        100% { transform: translate(-50%, -50%) scale(2.2); opacity: 0; }
    }

    /* Mobile: full-screen minimap, floating selector, bottom sheet. */
    @media (max-width: 768px) {
        #app { display: block; position: relative; height: 100dvh; overflow: hidden; }
        #map { position: absolute; inset: 0; }
        /* Lifts the attribution above the collapsed sheet; it is hidden while the sheet is open. */
        .leaflet-bottom.leaflet-right { bottom: calc(64px + 70px); }
        #app.sheet-open .leaflet-control-attribution { display: none; }
        /* The zoom buttons and the colourbar sit on the line below the selector row. */
        .leaflet-top.leaflet-left { margin-top: calc(max(12px, env(safe-area-inset-top)) + 44px + 8px); }
        .cbar { top: calc(max(12px, env(safe-area-inset-top)) + 44px + 8px); }
        .selector {
            position: absolute; top: 0; left: 0; right: 0; z-index: 800; padding: 12px;
            padding-top: max(12px, env(safe-area-inset-top));
        }
        .selector select { box-shadow: 0 2px 8px rgba(0,0,0,.25); border-color: transparent; }
        .panel {
            /* The sheet sits on top of the 70px navigation bar and leaves the floating selector (about 68px) uncovered. */
            position: absolute; left: 0; right: 0; bottom: 70px; z-index: 700;
            height: calc(100% - 72px - 70px);
            padding: 0 16px 24px; background: #f5f5f5; border-radius: 16px 16px 0 0;
            box-shadow: 0 -2px 12px rgba(0,0,0,.25);
            transform: translateY(calc(100% - 64px));
            transition: transform .25s ease-out;
            overflow: hidden; overscroll-behavior: contain;
        }
        .panel.open { transform: translateY(0); overflow-y: auto; }
        .handle {
            display: flex; align-items: center; justify-content: space-between; width: 100%; height: 64px; padding: 0;
            border: none; background: none; font-size: 15px; font-weight: 600; text-align: left; color: inherit; cursor: pointer;
            position: relative;
        }
        .handle::before {
            content: ""; position: absolute; top: 8px; left: 50%; width: 40px; height: 4px; margin-left: -20px;
            border-radius: 2px; background: #bbb;
        }
        .handle .chev { flex: none; transition: transform .25s; }
        .panel.open .handle .chev { transform: rotate(180deg); }
        h1 { display: none; }
        .tiles { grid-template-columns: repeat(2, 1fr); }
    }
</style>
</head>
<body>
<div id="app">
    <div class="selector">
        <select id="region" aria-label="Region"></select>
    </div>

    <div class="panel" id="panel">
        <button class="handle" id="handle" type="button" aria-expanded="false" aria-controls="panel-body">
            <span id="peek">Statistics</span><svg class="chev" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>
        </button>
        <div id="panel-body">
            <h1 id="title"></h1>
            <div class="tiles">
                <div class="tile"><div class="label">Mean</div><div class="value" id="t-mean">&ndash;</div></div>
                <div class="tile"><div class="label">Lowest</div><div class="value" id="t-min">&ndash;</div></div>
                <div class="tile"><div class="label">Highest</div><div class="value" id="t-max">&ndash;</div></div>
                <div class="tile"><div class="label">Stations</div><div class="value" id="t-n">&ndash;</div></div>
            </div>
            <div class="toggle" id="toggle">
                <button type="button" data-hours="24" class="active">24 h</button>
                <button type="button" data-hours="72">3 d</button>
                <button type="button" data-hours="168">7 d</button>
            </div>
            <div class="chart-box"><canvas id="chart"></canvas></div>
            <div class="compare" id="compare"></div>
            <p class="note" id="note"></p>
        </div>
    </div>

    <div id="map"></div>
</div>
<!--NAVBAR-->

<script id="stats-data" type="application/json">__STATS_DATA__</script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
(function () {
    'use strict';

    var DATA = JSON.parse(document.getElementById('stats-data').textContent);
    var TILE_URL = 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png?key=cb1_2lbv_1_b92d1df0645166c3311b1685';
    var TILE_ATTR = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors ' +
        '&copy; <a href="https://carto.com/attributions">CARTO</a>';
    var GRAY = '#c4c4c4';
    var ALL = 'all';
    var TIME_ZONE = 'America/Toronto';
    var MOBILE_QUERY = window.matchMedia('(max-width: 768px)');

    var state = { region: ALL, hours: 24 };
    var clustersById = {};
    DATA.clusters.forEach(function (c) { clustersById[c.id] = c; });

    /**
     * Combines the series of several clusters into one set of hourly mean, minimum and maximum prices.
     *
     * @param {Array<Object>} clusters - Clusters whose series are merged.
     * @returns {{n: number[], mean: Array<?number>, min: Array<?number>, max: Array<?number>}} One entry per time step.
     */
    function combine(clusters) {
        var steps = DATA.times.length;
        var out = { n: [], mean: [], min: [], max: [] };
        for (var i = 0; i < steps; i++) {
            var n = 0, sum = 0, lo = null, hi = null;
            clusters.forEach(function (c) {
                var s = c.series;
                if (!s.n[i]) { return; }
                n += s.n[i];
                sum += s.sum[i];
                lo = lo === null ? s.min[i] : Math.min(lo, s.min[i]);
                hi = hi === null ? s.max[i] : Math.max(hi, s.max[i]);
            });
            out.n.push(n);
            out.mean.push(n ? sum / n : null);
            out.min.push(lo);
            out.max.push(hi);
        }
        return out;
    }

    /**
     * Lists the clusters that make up a region choice.
     *
     * @param {string|number} region - `ALL` or a cluster id.
     * @returns {Array<Object>} The matching clusters.
     */
    function clustersFor(region) {
        return region === ALL ? DATA.clusters : [clustersById[region]];
    }

    /**
     * Formats a price for display.
     *
     * @param {?number} value - Price in cents per litre.
     * @returns {string} The price with one decimal, or a dash if missing.
     */
    function fmt(value) {
        return value === null || value === undefined ? '–' : value.toFixed(1);
    }

    /**
     * Formats an epoch time in Montréal time.
     *
     * @param {number} seconds - Seconds since the Unix epoch.
     * @param {boolean} withDate - Include the date as well as the time.
     * @returns {string} The formatted time.
     */
    function formatTime(seconds, withDate) {
        var options = { timeZone: TIME_ZONE, hour: '2-digit', minute: '2-digit', hourCycle: 'h23' };
        if (withDate) { options.month = 'short'; options.day = 'numeric'; }
        return new Intl.DateTimeFormat('en-CA', options).format(new Date(seconds * 1000));
    }

    /**
     * Formats an epoch time as "YYYY-MM-DD HH:MM" in Montréal time, like the "Updated" stamp on the main map.
     *
     * @param {number} seconds - Seconds since the Unix epoch.
     * @returns {string} The formatted date and time.
     */
    function formatStamp(seconds) {
        var p = {};
        new Intl.DateTimeFormat('en-CA', {
            timeZone: TIME_ZONE, hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit'
        }).formatToParts(new Date(seconds * 1000)).forEach(function (x) { p[x.type] = x.value; });
        return p.year + '-' + p.month + '-' + p.day + ' ' + p.hour + ':' + p.minute;
    }

    var TICK_HOURS = { 24: 3, 72: 12, 168: 24 };
    var PARTS = new Intl.DateTimeFormat('en-CA', {
        timeZone: TIME_ZONE, hourCycle: 'h23', year: 'numeric', month: 'numeric', day: 'numeric',
        hour: 'numeric', minute: 'numeric', second: 'numeric'
    });

    /**
     * Gives Montréal's offset from UTC at a moment.
     *
     * @param {number} seconds - Seconds since the Unix epoch.
     * @returns {number} Seconds to add to UTC to get Montréal wall-clock time (negative here).
     */
    function zoneOffset(seconds) {
        var p = {};
        PARTS.formatToParts(new Date(seconds * 1000)).forEach(function (x) { p[x.type] = parseInt(x.value, 10); });
        return Date.UTC(p.year, p.month - 1, p.day, p.hour, p.minute, p.second) / 1000 - Math.floor(seconds);
    }

    /**
     * Lists the moments in a range that fall on multiples of a step in Montréal wall-clock time.
     *
     * @param {number} min - Start of the range, in epoch seconds.
     * @param {number} max - End of the range, in epoch seconds.
     * @param {number} step - Spacing in seconds; a divisor of a day so ticks include local midnight.
     * @returns {number[]} Epoch seconds of each tick.
     */
    function roundTimes(min, max, step) {
        var out = [];
        var local = Math.ceil((min + zoneOffset(min)) / step) * step;
        for (; ; local += step) {
            var t = local - zoneOffset(local - zoneOffset(local));
            if (t > max) { break; }
            if (t >= min) { out.push(t); }
        }
        return out;
    }

    /**
     * Labels a gridline: the time of day, or the date at midnight (and for daily ticks).
     *
     * @param {number} seconds - Epoch seconds of the tick.
     * @returns {string} The label.
     */
    function formatTick(seconds) {
        if (state.hours <= 24) { return formatTime(seconds, false); }
        var time = formatTime(seconds, false);
        if (state.hours > 72 || time === '00:00') {
            return new Intl.DateTimeFormat('en-CA', { timeZone: TIME_ZONE, month: 'short', day: 'numeric' }).format(new Date(seconds * 1000));
        }
        return time;
    }

    // --- Region selector -------------------------------------------------------------------
    var select = document.getElementById('region');

    /**
     * Fills the dropdown with "All regions" and the frozen clusters, grouped by island or off-island.
     */
    function buildSelector() {
        var all = document.createElement('option');
        all.value = ALL;
        all.textContent = 'All regions';
        select.appendChild(all);

        [['Montréal island', true], ['Off the island', false]].forEach(function (group) {
            var members = DATA.clusters.filter(function (c) { return c.island === group[1]; });
            if (!members.length) { return; }
            var el = document.createElement('optgroup');
            el.label = group[0];
            members.forEach(function (c) {
                var opt = document.createElement('option');
                opt.value = c.id;
                opt.textContent = c.name;
                el.appendChild(opt);
            });
            select.appendChild(el);
        });
    }

    // --- Minimap ---------------------------------------------------------------------------
    var map = L.map('map', { preferCanvas: true }).setView([45.55, -73.6], 10);
    L.tileLayer(TILE_URL, { attribution: TILE_ATTR, maxZoom: 19 }).addTo(map);

    /**
     * Escapes text for safe use in tooltip markup.
     *
     * @param {string} text - Raw text.
     * @returns {string} Text with HTML special characters escaped.
     */
    function esc(text) {
        return String(text).replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
    }

    /**
     * Builds the tooltip table in the main map's format (the fields available on this page).
     *
     * @param {Array} s - A row of `DATA.stations`.
     * @returns {string} Table markup.
     */
    function tooltipHtml(s) {
        var rows = [['Name', s[4]], ['brand', s[6]], ['Address', s[7]], [DATA.gas_type, s[2]]];
        return '<table>' + rows.map(function (r) {
            return '<tr><th>' + esc(r[0]) + '</th><td>' + esc(r[1]) + '</td></tr>';
        }).join('') + '</table>';
    }

    var markers = DATA.stations.map(function (s) {
        return L.circleMarker([s[0], s[1]], { radius: 5, weight: 2, color: s[5], fillColor: s[5], fillOpacity: 0.5 })
            .bindTooltip(tooltipHtml(s), { sticky: true, className: 'foliumtooltip' }).addTo(map);
    });

    /**
     * Colours the selected region's stations with the price scale and grays out the others.
     *
     * @param {boolean} recenter - Also fit the map to the selected region (only when the region changes).
     */
    function updateMap(recenter) {
        var bounds = [];
        DATA.stations.forEach(function (s, i) {
            var selected = state.region === ALL || s[3] === state.region;
            markers[i].setStyle(selected
                ? { color: s[5], fillColor: s[5], fillOpacity: 0.5, opacity: 1 }
                : { color: GRAY, fillColor: GRAY, fillOpacity: 0.3, opacity: 0.6 });
            if (selected) { bounds.push([s[0], s[1]]); }
        });
        // Raised after styling so the coloured stations are never hidden behind gray ones.
        DATA.stations.forEach(function (s, i) {
            if (state.region === ALL || s[3] === state.region) { markers[i].bringToFront(); }
        });
        if (recenter && bounds.length) {
            // On mobile the top is covered by the selector and colourbar, and the bottom by the collapsed sheet.
            var mobile = MOBILE_QUERY.matches;
            map.fitBounds(bounds, { paddingTopLeft: [20, mobile ? 120 : 20], paddingBottomRight: [20, mobile ? 90 : 20], maxZoom: 14 });
        }
    }

    // --- User location ---------------------------------------------------------------------
    var NEAREST_LIMIT_KM = 15;

    /**
     * Finds the region of the station nearest to a point.
     *
     * @param {number} lat - Latitude in degrees.
     * @param {number} lon - Longitude in degrees.
     * @returns {?number} The cluster id, or null if no station is within `NEAREST_LIMIT_KM`.
     */
    function regionNear(lat, lon) {
        var best = null, bestKm = NEAREST_LIMIT_KM;
        var kmPerLon = 111.32 * Math.cos(lat * Math.PI / 180);
        DATA.stations.forEach(function (s) {
            var dy = (s[0] - lat) * 110.57, dx = (s[1] - lon) * kmPerLon;
            var km = Math.sqrt(dx * dx + dy * dy);
            if (km < bestKm) { bestKm = km; best = s[3]; }
        });
        return best;
    }

    /**
     * Shows the user's location with the main map's marker and opens the page on their region.
     */
    function locateUser() {
        if (!navigator.geolocation) { return; }
        navigator.geolocation.getCurrentPosition(function (pos) {
            var lat = pos.coords.latitude, lon = pos.coords.longitude;
            var icon = L.divIcon({
                html: '<div class="blue-dot"></div><div class="blue-dot-pulse"></div>',
                className: 'user-location-marker', iconSize: [32, 32], iconAnchor: [16, 16]
            });
            L.marker([lat, lon], { icon: icon, zIndexOffset: 1000, interactive: false }).addTo(map);
            var region = regionNear(lat, lon);
            if (region !== null && clustersById[region]) {
                state.region = region;
                select.value = String(region);
                update(true);
            }
        }, function () { /* Stay on "All regions". */ }, { enableHighAccuracy: false, timeout: 7000, maximumAge: 60000 });
    }

    // --- Chart -----------------------------------------------------------------------------
    var chart = new Chart(document.getElementById('chart'), {
        type: 'line',
        data: {
            datasets: [
                { label: 'Highest', borderColor: '#D47318', backgroundColor: '#D47318' },
                { label: 'Mean', borderColor: '#007aff', backgroundColor: '#007aff', borderWidth: 3 },
                { label: 'Lowest', borderColor: '#39C018', backgroundColor: '#39C018' }
            ].map(function (d) { return Object.assign({ data: [], pointRadius: 0, pointHoverRadius: 4, borderWidth: 2, tension: 0 }, d); })
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: false,
            parsing: false,
            interaction: { mode: 'index', intersect: false },
            plugins: {
                legend: { position: 'bottom', labels: { boxWidth: 12 } },
                tooltip: {
                    callbacks: {
                        title: function (items) { return formatTime(items[0].parsed.x, true); },
                        label: function (item) { return item.dataset.label + ': ' + fmt(item.parsed.y) + '¢'; }
                    }
                }
            },
            scales: {
                x: {
                    type: 'linear',
                    // Gridlines fall on round Montréal times (every 3 h, 12 h or 24 h depending on the window).
                    afterBuildTicks: function (scale) {
                        var step = TICK_HOURS[state.hours] || 3;
                        scale.ticks = roundTimes(scale.min, scale.max, step * 3600).map(function (t) { return { value: t }; });
                    },
                    ticks: {
                        maxRotation: 0,
                        callback: function (value) { return formatTick(value); }
                    }
                },
                y: { ticks: { callback: function (value) { return value.toFixed(0); } }, title: { display: true, text: '¢/L' } }
            }
        }
    });

    /**
     * Redraws the trendline for the selected region and window.
     *
     * @param {{mean: Array<?number>, min: Array<?number>, max: Array<?number>}} series - Hourly series of the region.
     */
    function updateChart(series) {
        var first = Math.max(0, DATA.times.length - 1 - state.hours);
        var points = function (values) {
            var out = [];
            for (var i = first; i < DATA.times.length; i++) { out.push({ x: DATA.times[i], y: values[i] }); }
            return out;
        };
        chart.data.datasets[0].data = points(series.max);
        chart.data.datasets[1].data = points(series.mean);
        chart.data.datasets[2].data = points(series.min);
        chart.options.scales.x.min = DATA.times[first];
        chart.options.scales.x.max = DATA.times[DATA.times.length - 1];
        chart.update();
    }

    // --- Statistics and comparisons --------------------------------------------------------
    /**
     * Builds one comparison tile showing how much a region's price differs from a reference.
     *
     * @param {string} label - What the region is compared with.
     * @param {?number} diff - Region mean minus reference mean, in cents per litre.
     * @returns {string} Tile markup, or an empty string if the difference is unknown.
     */
    function compareTile(label, diff) {
        if (diff === null) { return ''; }
        var cls = Math.abs(diff) < 0.05 ? '' : (diff > 0 ? 'up' : 'down');
        var sign = diff > 0.05 ? '+' : (diff < -0.05 ? '−' : '');
        return '<div class="tile"><div class="label">' + label + '</div><div class="value ' + cls + '">' + sign +
            Math.abs(diff).toFixed(1) + ' <span class="unit">¢/L</span></div></div>';
    }

    /**
     * Refreshes the tiles, comparisons, chart and minimap for the current selection.
     *
     * @param {boolean} recenter - Fit the minimap to the region; true only when the region itself changed.
     */
    function update(recenter) {
        var region = state.region === ALL ? null : clustersById[state.region];
        var series = combine(clustersFor(state.region));
        // The axis ends at the render time, but the figures come from the latest step that has prices.
        var last = series.n.length - 1;
        while (last > 0 && !series.n[last]) { last--; }
        var name = region ? region.name : 'All regions';

        document.getElementById('title').textContent = DATA.gas_type + ' – ' + name;
        document.getElementById('t-mean').innerHTML = fmt(series.mean[last]) + ' <span class="unit">¢</span>';
        document.getElementById('t-min').innerHTML = fmt(series.min[last]) + ' <span class="unit">¢</span>';
        document.getElementById('t-max').innerHTML = fmt(series.max[last]) + ' <span class="unit">¢</span>';
        document.getElementById('t-n').textContent = series.n[last];
        document.getElementById('peek').textContent = name + ' · ' + fmt(series.mean[last]) + '¢ average';

        // --- Comparisons only make sense for a single region ---------------------------
        var html = '';
        if (region && series.mean[last] !== null) {
            var greater = combine(DATA.clusters);
            html += compareTile('vs Greater Montréal', series.mean[last] - greater.mean[last]);
            if (region.island) {
                var others = DATA.clusters.filter(function (c) { return c.island && c.id !== region.id; });
                var rest = combine(others);
                if (rest.mean[last] !== null) { html += compareTile('vs rest of the island', series.mean[last] - rest.mean[last]); }
            }
        }
        document.getElementById('compare').innerHTML = html;
        document.getElementById('note').textContent =
            'Last updated ' + formatStamp(DATA.times[DATA.times.length - 1]) + ' (Montréal time). Differences compare average prices.';

        updateChart(series);
        updateMap(recenter);
    }

    // --- Events ----------------------------------------------------------------------------
    select.addEventListener('change', function () {
        state.region = select.value === ALL ? ALL : parseInt(select.value, 10);
        update(true);
    });

    document.getElementById('toggle').addEventListener('click', function (event) {
        var button = event.target.closest('button');
        if (!button) { return; }
        state.hours = parseInt(button.dataset.hours, 10);
        Array.prototype.forEach.call(this.children, function (b) { b.classList.toggle('active', b === button); });
        update();
    });

    var panel = document.getElementById('panel');
    var handle = document.getElementById('handle');
    handle.addEventListener('click', function () {
        var open = panel.classList.toggle('open');
        document.getElementById('app').classList.toggle('sheet-open', open);
        handle.setAttribute('aria-expanded', open);
        // The chart is measured while the sheet slides, so resize it once the transition ends.
        setTimeout(function () { chart.resize(); }, 300);
    });

    window.addEventListener('resize', function () { map.invalidateSize(); });

    buildSelector();
    buildColorbar(document.getElementById('map'), DATA.gas_type, DATA.colors.index, DATA.colors.colors);
    update(true);
    locateUser();
}());
</script>
</body>
</html>
