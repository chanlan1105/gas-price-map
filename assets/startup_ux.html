<style>
    /* Startup Flow CSS */
    #startup-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #ffffff;
        /* Solid background to hide map loading */
        z-index: 10000;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.5s ease-out;
    }

    #startup-icon {
        width: 100px;
        height: 100px;
        opacity: 0;
        transform: translateY(20px);
    }

    #startup-icon.float-in {
        animation: float-in 1s forwards ease-out;
    }

    #startup-icon.float-out {
        animation: float-out 1s forwards ease-in;
    }

    @keyframes float-in {
        from {
            opacity: 0;
            transform: translateY(20px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @keyframes float-out {
        from {
            opacity: 1;
            transform: translateY(0);
        }

        to {
            opacity: 0;
            transform: translateY(-20px);
        }
    }

    #startup-modal {
        position: absolute;
        bottom: 15%;
        left: 50%;
        transform: translateX(-50%);
        background: white;
        padding: 24px;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        text-align: center;
        width: 90%;
        max-width: 320px;
        font-family: sans-serif;
        opacity: 0;
        transition: opacity 0.3s ease-in-out;
        display: none;
    }

    #startup-modal.show {
        display: block;
        opacity: 1;
    }

    #startup-modal h2 {
        margin: 0 0 12px 0;
        font-size: 18px;
        color: #333;
    }

    #startup-modal p {
        margin: 0 0 20px 0;
        font-size: 14px;
        color: #666;
        line-height: 1.5;
    }

    .modal-buttons {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .btn {
        padding: 12px;
        border-radius: 8px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        border: none;
        transition: background-color 0.2s;
    }

    .btn-primary {
        background-color: #007aff;
        color: white;
    }

    .btn-primary:hover {
        background-color: #005bb5;
    }

    .btn-outline {
        background-color: transparent;
        color: #007aff;
        border: 2px solid #007aff;
    }

    .btn-outline:hover {
        background-color: #f0f8ff;
    }

    #loading-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.7);
        z-index: 10000;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: white;
        font-family: sans-serif;
        transition: opacity 0.5s ease-out;
    }

    #loading-overlay.show {
        display: flex;
    }

    .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid rgba(255, 255, 255, 0.3);
        border-top: 4px solid white;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 16px;
    }

    @keyframes spin {
        0% {
            transform: rotate(0deg);
        }

        100% {
            transform: rotate(360deg);
        }
    }
</style>

<div id="startup-overlay">
    <img id="startup-icon" src="favicon.png" alt="Gas Icon">
    <div id="startup-modal">
        <h2>Find Gas Near You</h2>
        <p>Allow location access to quickly find the best gas prices in your area.</p>
        <div class="modal-buttons">
            <button id="btn-okay" class="btn btn-primary">Okay</button>
            <button id="btn-no-thanks" class="btn btn-outline">No thanks</button>
            <button id="btn-cancel" class="btn btn-outline" style="display: none;">Cancel</button>
        </div>
    </div>
</div>

<div id="loading-overlay">
    <div class="spinner"></div>
    <div>Getting your location...</div>
</div>

<script defer>
    var isPaginationNav = !!window.location.hash;
    if (isPaginationNav) {
        window.appSkipRecenter = true;
    }

    (function () {
        var startupOverlay = document.getElementById('startup-overlay');
        var startupIcon = document.getElementById('startup-icon');
        var startupModal = document.getElementById('startup-modal');
        var loadingOverlay = document.getElementById('loading-overlay');
        var btnOkay = document.getElementById('btn-okay');
        var btnNoThanks = document.getElementById('btn-no-thanks');
        var btnCancel = document.getElementById('btn-cancel');

        function hasSkipCookie() {
            return document.cookie.split('; ').indexOf('skip_location_prompt=true') !== -1;
        }

        function setSkipCookie() {
            var d = new Date();
            d.setTime(d.getTime() + (365 * 24 * 60 * 60 * 1000));
            document.cookie = "skip_location_prompt=true;expires=" + d.toUTCString() + ";path=/";
        }

        function removeOverlay() {
            startupOverlay.style.opacity = '0';
            setTimeout(function () {
                startupOverlay.style.display = 'none';
            }, 500);
        }

        function hideLoadingOverlay() {
            loadingOverlay.style.opacity = '0';
            setTimeout(function () {
                loadingOverlay.classList.remove('show');
            }, 500);
        }

        let hasProceeded = false;
        function proceedToMap(isDenied) {
            if (hasProceeded) return;
            hasProceeded = true;
            
            startupModal.classList.remove('show');
            startupIcon.classList.remove('float-in');
            startupIcon.classList.add('float-out');
            setTimeout(function () {
                removeOverlay();
                if (isDenied) {
                    window.appUpdateFabState?.('denied');
                    window.appFallbackToMontreal?.();
                }
            }, 1000);
        }

        window.addEventListener("load", function () {
            if (isPaginationNav) {
                startupOverlay.style.display = 'none';
                if (navigator.permissions && navigator.permissions.query) {
                    navigator.permissions.query({ name: 'geolocation' }).then(function (result) {
                        if (result.state === 'granted' && window.appLocateUser) {
                            window.appLocateUser(true);
                        }
                    });
                }
                return;
            }

            setTimeout(function () {
                // Unconditional initial animation
                startupIcon.classList.add('float-in');

                let timerDone = false;
                let permState = null;
                let locationFetched = false;

                function startLocating() {
                    if (window.appLocateUser) {
                        window.appLocateUser(true).then(() => {
                            locationFetched = true;
                            hideLoadingOverlay();
                        }).catch(() => {
                            locationFetched = true;
                            hideLoadingOverlay();
                        });
                    }
                }

                // Start 1-second timer
                setTimeout(function() {
                    timerDone = true;
                    checkState();
                }, 1000);

                // Permission check
                if (hasSkipCookie()) {
                    permState = 'cookie';
                    checkState();
                } else if (navigator.permissions && navigator.permissions.query) {
                    navigator.permissions.query({ name: 'geolocation' }).then(function (result) {
                        permState = result.state;
                        if (permState === 'granted') {
                            startLocating();
                        }
                        checkState();
                    }).catch(function () {
                        permState = 'prompt';
                        checkState();
                    });
                } else {
                    permState = 'prompt';
                    checkState();
                }

                function checkState() {
                    if (!timerDone || !permState) return;

                    if (permState === 'granted' || permState === 'denied' || permState === 'cookie') {
                        // proceed with float-out
                        startupIcon.classList.remove('float-in');
                        startupIcon.classList.add('float-out');
                        
                        setTimeout(function () {
                            removeOverlay();
                            
                            if (permState === 'granted') {
                                if (!locationFetched) {
                                    loadingOverlay.classList.add('show');
                                }
                            } else {
                                window.appUpdateFabState?.('denied');
                                window.appFallbackToMontreal?.();
                            }
                        }, 1000); // 1s float out

                    } else if (permState === 'prompt') {
                        startupModal.classList.add('show');
                    }
                }
            }, 100);
        });

        btnOkay.addEventListener('click', function () {
            var modalTitle = startupModal.querySelector('h2');
            var modalDesc = startupModal.querySelector('p');
            
            modalTitle.textContent = "Waiting for permission";
            modalDesc.textContent = "Please allow location access in your browser prompt.";
            btnOkay.style.display = 'none';
            btnNoThanks.style.display = 'none';
            btnCancel.style.display = 'block';

            if (window.appLocateUser) {
                window.appLocateUser(true).then(() => {
                    proceedToMap(false);
                }).catch(() => {
                    proceedToMap(true);
                });
            } else {
                proceedToMap(true);
            }
        });

        btnNoThanks.addEventListener('click', function () {
            setSkipCookie();
            proceedToMap(true);
        });

        btnCancel.addEventListener('click', function () {
            setSkipCookie();
            proceedToMap(true);
        });

    })();
</script>
